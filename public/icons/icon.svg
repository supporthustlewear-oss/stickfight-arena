<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141430"/>
      <stop offset="1" stop-color="#05050a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd700"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="90" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>
  <!-- glow orbs -->
  <circle cx="150" cy="200" r="46" fill="rgba(255,45,45,0.35)"/>
  <circle cx="362" cy="200" r="46" fill="rgba(45,156,255,0.35)"/>
  <!-- P1 red stickman (left, punching) -->
  <g stroke="#ffffff" stroke-width="16" stroke-linecap="round" fill="none">
    <line x1="150" y1="290" x2="150" y2="360"/>
    <line x1="150" y1="320" x2="120" y2="380"/>
    <line x1="150" y1="320" x2="180" y2="380"/>
    <line x1="150" y1="300" x2="122" y2="268"/>
    <line x1="150" y1="300" x2="186" y2="262"/>
  </g>
  <circle cx="150" cy="222" r="30" fill="#ffffff"/>
  <circle cx="140" cy="214" r="6" fill="#0a0a0a"/>
  <circle cx="152" cy="205" r="14" fill="rgba(255,45,45,0.9)"/>
  <circle cx="164" cy="203" r="8" fill="rgba(255,45,45,0.5)"/>
  <!-- P2 blue stickman (right, blocking) -->
  <g stroke="#ffffff" stroke-width="16" stroke-linecap="round" fill="none">
    <line x1="362" y1="290" x2="362" y2="360"/>
    <line x1="362" y1="320" x2="392" y2="380"/>
    <line x1="362" y1="320" x2="332" y2="380"/>
    <line x1="362" y1="300" x2="390" y2="268"/>
    <line x1="362" y1="300" x2="332" y2="286"/>
  </g>
  <circle cx="362" cy="222" r="30" fill="#ffffff"/>
  <circle cx="372" cy="214" r="6" fill="#0a0a0a"/>
  <circle cx="360" cy="205" r="14" fill="rgba(45,156,255,0.9)"/>
  <circle cx="348" cy="203" r="8" fill="rgba(45,156,255,0.5)"/>
  <!-- impact star -->
  <g fill="#ffd700">
    <polygon points="256,180 264,212 296,212 270,232 280,264 256,244 232,264 242,232 216,212 248,212"/>
  </g>
  <circle cx="256" cy="212" r="10" fill="#ffffff"/>
  <!-- floor -->
  <line x1="70" y1="420" x2="442" y2="420" stroke="rgba(255,255,255,0.35)" stroke-width="8" stroke-linecap="round"/>
  <line x1="70" y1="420" x2="442" y2="420" stroke="#ffd700" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <text x="256" y="478" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="34" fill="url(#gold)" text-anchor="middle" letter-spacing="6">STICKFIGHT</text>
</svg>
